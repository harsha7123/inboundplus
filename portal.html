<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Portal · InboundPlus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="portal">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="index.html"><span class="brand-mark">i+</span><span>InboundPlus<small id="sideCompany">Client Hub</small></span></a>
    <nav class="nav" id="nav" aria-label="Portal menu"></nav>
    <div class="side-foot">
      <div class="am-card">
        <div class="avatar sm blue" id="amInit">LR</div>
        <div style="flex:1;min-width:0"><b id="amName">Lucía Ramos</b><small class="muted" style="display:block">Your account manager</small></div>
        <button class="icon-btn" style="width:32px;height:32px" title="Message" onclick="Portal.go('messages')"><span data-icon="chat"></span></button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" aria-label="Open menu" onclick="document.getElementById('sidebar').classList.toggle('open')"><span data-icon="menu"></span></button>
      <div class="search">
        <span data-icon="search"></span>
        <input class="input" id="globalSearch" placeholder="Search pages, reports, software, blog…" autocomplete="off" aria-label="Search">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="top-actions">
        <div style="position:relative">
          <button class="icon-btn" id="bellBtn" aria-label="Notifications"><span data-icon="bell"></span><span class="pip" id="bellPip"></span></button>
          <div class="dropdown" id="bellMenu"><h4>Notifications</h4><div id="notifList"></div></div>
        </div>
        <div class="user-chip" id="userChip" tabindex="0">
          <div class="avatar sm" id="userInit">CM</div>
          <div class="who"><b id="userName">Carla</b><small id="userCompany">Company</small></div>
          <div class="dropdown" id="userMenu" style="width:220px">
            <h4 id="userEmail">email</h4>
            <button class="nav-item" onclick="Portal.go('settings')"><span data-icon="gear"></span>Settings</button>
            <button class="nav-item" onclick="Portal.go('billing')"><span data-icon="card"></span>Billing</button>
            <button class="nav-item" id="logoutBtn"><span data-icon="logout"></span>Log out</button>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="modal-back" id="modal" role="dialog" aria-modal="true"><div class="modal" id="modalBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/portal.js"></script>
</body>
</html>
